<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f3ed" />
  <meta name="description" content="Nine — Gamer, music lover, anime fan. Welcome to my little corner." />
  <title>My Space — Nine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,300..500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f3ed;
      --paper: rgba(255, 253, 249, .88);
      --paper-solid: #fffdf9;
      --ink: #25272a;
      --muted: #7a7e80;
      --sage: #536a60;
      --sage-soft: #e4e9e4;
      --line: #dedbd3;
      --shadow: 0 12px 30px rgba(54, 52, 47, .07);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 16%, rgba(224, 228, 219, .38), transparent 28rem),
        radial-gradient(ellipse at 92% 60%, rgba(228, 224, 215, .42), transparent 30rem),
        var(--bg);
      font-family: "DM Sans", "IBM Plex Sans Thai", sans-serif;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; }
    .page {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      overflow: hidden;
    }

    /* HERO */
    .hero {
      position: relative;
      isolation: isolate;
      min-height: 590px;
      display: flex;
      align-items: flex-start;
      padding: 48px 0 36px 5.5%;
    }
    .hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background: linear-gradient(115deg, rgba(248,246,240,.98) 0%, rgba(248,246,240,.92) 38%, rgba(248,246,240,.16) 74%, rgba(248,246,240,.04) 100%);
    }
    .hero-art {
      position: absolute;
      z-index: -1;
      top: 0;
      right: -12px;
      width: 55%;
      height: 100%;
      object-fit: cover;
      object-position: center 16%;
      opacity: .98;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 13%, #000 32%), linear-gradient(to bottom, #000 0%, #000 73%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.35) 13%, #000 32%), linear-gradient(to bottom, #000 0%, #000 73%, transparent 100%);
      mask-composite: intersect;
    }
    .hero-copy { width: 53%; max-width: 540px; padding-top: 8px; }

    .brand {
  margin: 0 0 30px;
  font-family: "DM Sans", sans-serif;
  font-size: clamp(2.1rem, 4vw, 3rem);
  font-weight: 300;
  letter-spacing: -0.03em;
  color: #2e3234;
}
    .brand::after {
      content: "";
      display: block;
      width: 56px;
      height: 1px;
      margin: 14px 0 0 2px;
      background: linear-gradient(90deg, var(--sage), transparent);
      opacity: .6;
    }

    .profile-row { display: flex; align-items: center; gap: 22px; margin: 12px 0 24px; }
    .avatar-frame {
      width: 154px;
      height: 154px;
      flex: 0 0 154px;
      border-radius: 50%;
      overflow: hidden;
      padding: 5px;
      background: #fffdf8;
      border: 2px solid #cbd4ca;
      box-shadow: 0 7px 22px rgba(36, 43, 39, .12);
    }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .profile-info {
      border-left: 1px solid rgba(83,106,96,.3);
      padding: 6px 0 6px 22px;
    }
    .profile-info h1 {
      margin: 0;
      font-size: clamp(1.9rem, 3.6vw, 2.65rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .handle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 300;
      letter-spacing: .03em;
    }

    .bio {
      margin: 22px 0 0 2px;
      max-width: 440px;
      color: #4b4f52;
      font-size: .9rem;
    }
    .bio-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    .bio-line span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-weight: 400;
      letter-spacing: .01em;
    }
    .bio-line span + span::before {
      content: "·";
      margin-right: 4px;
      color: var(--sage);
      opacity: .55;
    }
    .bio-sub {
      margin: 8px 0 0;
      font-size: .84rem;
      font-weight: 300;
      font-style: normal;
      letter-spacing: .03em;
      color: var(--muted);
    }

    /* SECTIONS + CARDS */
    main { position: relative; z-index: 1; }
    .section { margin: 0 0 42px; }
    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      padding-left: 2px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .section-heading::before {
      content: "";
      width: 18px;
      height: 1px;
      border-radius: 2px;
      background: var(--sage);
      opacity: .7;
    }

    .link-list { display: grid; gap: 16px; }
    .link-card {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      min-height: 142px;
      gap: 22px;
      padding: 20px 28px 20px 20px;
      overflow: hidden;
      border: 1px solid rgba(193,188,178,.82);
      border-radius: var(--radius);
      background: linear-gradient(105deg, rgba(255,253,249,.97), rgba(255,253,249,.82));
      box-shadow: 0 3px 0 rgba(71,67,59,.04), var(--shadow);
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .link-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,253,249,0) 38%, rgba(255,253,249,.18) 65%, rgba(255,253,249,.48));
      pointer-events: none;
    }
    .link-card:hover {
      transform: translateY(-3px);
      border-color: #aeb9b0;
      box-shadow: 0 14px 30px rgba(54,52,47,.11);
    }
    .link-card:active { transform: translateY(-1px); }
    .link-card:focus-visible { outline: 3px solid rgba(83,106,96,.55); outline-offset: 4px; }
    .icon-box {
      width: 112px;
      height: 112px;
      flex: 0 0 112px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      background: var(--sage-soft);
      color: var(--sage);
    }
    .icon-box svg { width: 46px; height: 46px; stroke: currentColor; stroke-width: 1.65; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .link-content { position: relative; z-index: 2; min-width: 0; flex: 1; }
    .link-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .link-title {
      margin: 0;
      font-size: 1.24rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .link-desc {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 400;
      line-height: 1.55;
    }
    .pill {
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--sage-soft);
      border: 1px solid rgba(83,106,96,.18);
      color: var(--sage);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .card-art {
      position: absolute;
      z-index: -1;
      top: 0;
      right: 42px;
      width: 33%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: .77;
      mix-blend-mode: multiply;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 40%, #000 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 40%, #000 100%);
    }
    .arrow {
      position: relative;
      z-index: 3;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      color: #424a47;
      transition: transform .2s ease;
    }
    .link-card:hover .arrow { transform: translateX(5px); }
    .arrow svg { display: block; width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .social-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .social-card { min-height: 136px; padding: 18px; gap: 18px; }
    .social-card .icon-box { width: 92px; height: 92px; flex-basis: 92px; border-radius: 17px; }
    .social-card .icon-box svg { width: 42px; height: 42px; }
    .social-card .link-title { font-size: 1.08rem; letter-spacing: -0.015em; }
    .social-card .link-desc { font-size: .84rem; }
    .social-card .arrow { width: 24px; height: 24px; }

    footer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      margin: 4px 0 20px;
      color: var(--muted);
      text-align: center;
    }
    .footer-quote {
      width: min(560px, 70%);
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: .04em;
    }
    .footer-rule { display: inline-block; width: 32%; height: 1px; margin: 0 14px 6px; background: #bfc3b9; }
    .footer-star { color: var(--sage); font-style: normal; font-size: 1.05rem; opacity: .85; }
    .cat-accent { position: absolute; right: -8px; bottom: -14px; width: 142px; opacity: .92; pointer-events: none; }

    @media (min-width: 1200px) {
      .page { width: min(1120px, calc(100% - 64px)); }
    }
    @media (max-width: 760px) {
      .page { width: min(100% - 28px, 620px); }
      .hero { min-height: 590px; padding: 34px 20px 30px; }
      .hero-art {
        right: -65px;
        width: 82%;
        height: 430px;
        opacity: .60;
        object-position: center 12%;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.55) 25%, #000 55%), linear-gradient(to bottom, #000 0%, #000 63%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,.55) 25%, #000 55%), linear-gradient(to bottom, #000 0%, #000 63%, transparent 100%);
        mask-composite: intersect;
      }
      .hero::before { background: linear-gradient(180deg, rgba(248,246,240,.40) 0%, rgba(248,246,240,.70) 48%, #f6f3ed 92%); }
      .hero-copy { width: 100%; max-width: none; padding-top: 0; }
      .brand { font-size: 3.1rem; margin-bottom: 22px; }
      .profile-row { margin-top: 10px; gap: 15px; }
      .avatar-frame { width: 120px; height: 120px; flex-basis: 120px; }
      .profile-info { padding-left: 15px; }
      .profile-info h1 { font-size: 2rem; }
      .bio { margin-top: 18px; font-size: .84rem; }
      .bio-line { gap: 6px 8px; }
      .bio-line span { font-size: .84rem; }
      .bio-sub { margin-left: 0; font-size: .8rem; }
      .section { margin-bottom: 32px; }
      .link-card { min-height: 120px; padding: 15px; gap: 14px; border-radius: 18px; }
      .icon-box { width: 82px; height: 82px; flex-basis: 82px; border-radius: 15px; }
      .icon-box svg { width: 38px; height: 38px; }
      .link-title { font-size: 1.06rem; }
      .link-desc { font-size: .8rem; }
      .pill { font-size: .64rem; padding: 2px 8px; }
      .card-art { right: 24px; width: 38%; opacity: .48; }
      .arrow { width: 24px; height: 24px; }
      .social-grid { gap: 12px; }
      .social-card { min-height: 104px; padding: 12px; gap: 10px; }
      .social-card .icon-box { width: 60px; height: 60px; flex-basis: 60px; border-radius: 13px; }
      .social-card .icon-box svg { width: 30px; height: 30px; }
      .social-card .link-title { font-size: .96rem; }
      .social-card .link-desc { font-size: .76rem; }
      .social-card .arrow { width: 20px; height: 20px; }
      .footer-quote { width: 76%; font-size: 1rem; }
      .footer-rule { width: 20%; margin: 0 8px 5px; }
      .cat-accent { width: 100px; right: -12px; bottom: -8px; }
    }
    @media (max-width: 420px) {
      .hero { min-height: 555px; padding-left: 14px; padding-right: 14px; }
      .brand { font-size: 2.75rem; }
      .avatar-frame { width: 102px; height: 102px; flex-basis: 102px; }
      .profile-info h1 { font-size: 1.75rem; }
      .handle { font-size: .84rem; }
      .bio-line { gap: 6px 8px; }
      .bio-line span { font-size: .78rem; }
      .link-card { min-height: 108px; gap: 10px; padding: 12px; }
      .icon-box { width: 68px; height: 68px; flex-basis: 68px; }
      .icon-box svg { width: 32px; height: 32px; }
      .link-title { font-size: .98rem; }
      .link-desc { font-size: .75rem; }
      .card-art { width: 34%; right: 18px; opacity: .35; }
      .social-grid { grid-template-columns: 1fr; }
      .social-card { min-height: 88px; }
      .social-card .icon-box { width: 58px; height: 58px; flex-basis: 58px; }
      .social-card .link-title { font-size: .96rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
