<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e5e9ea" />
  <meta name="description" content="Nine — Gamer, music lover, anime fan. Welcome to my little corner." />
  <title>Nine — My Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ice: #e5e9ea;
      --mist: #d2d7dd;
      --blue-gray: #b8c8d8;
      --powder: #abbad1;
      --sky: #84aacf;
      --slate: #384868;
      --navy: #173150;
      --steel: #627ea3;
      --blue: #3c6496;
      --deep: #1c3e6d;
      --paper: rgba(250, 252, 253, .84);
      --paper-strong: rgba(248, 251, 253, .94);
      --line: rgba(98, 126, 163, .28);
      --shadow: 0 14px 34px rgba(23, 49, 80, .12);
      --round-xl: 34px;
      --round-lg: 27px;
      --round-md: 21px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      color: var(--navy);
      font-family: Inter, "IBM Plex Sans Thai", sans-serif;
      font-weight: 500;
      line-height: 1.55;
      background:
        radial-gradient(ellipse at 12% 4%, rgba(184,200,216,.62), transparent 30rem),
        radial-gradient(ellipse at 90% 20%, rgba(171,186,209,.48), transparent 34rem),
        radial-gradient(ellipse at 50% 100%, rgba(210,215,221,.68), transparent 38rem),
        var(--ice);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    img { display: block; max-width: 100%; }

    /* The user's portrait wallpaper stays on the outer edges, away from the center. */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      top: 0;
      bottom: 0;
      width: min(27vw, 390px);
      background: url("background.jpg") center / auto 100% no-repeat;
      opacity: .15;
      pointer-events: none;
    }
    body::before {
      left: 0;
      -webkit-mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,.7) 45%, transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,.7) 45%, transparent 100%);
    }
    body::after {
      right: 0;
      transform: scaleX(-1);
      -webkit-mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,.7) 45%, transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,.7) 45%, transparent 100%);
    }

    .site-shell {
      position: relative;
      z-index: 1;
      width: min(1460px, calc(100% - 56px));
      margin: 0 auto;
      padding: 22px 0 18px;
    }

    /* HERO */
    .hero {
      position: relative;
      isolation: isolate;
      min-height: 640px;
      display: flex;
      align-items: flex-start;
      padding: 36px 0 42px 3.8%;
      overflow: visible;
    }
    .hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      border-radius: 42px;
      background:
        radial-gradient(ellipse at 5% 13%, rgba(255,255,255,.9) 0 14%, transparent 36%),
        radial-gradient(ellipse at 60% 94%, rgba(248,251,255,.72) 0 14%, transparent 35%),
        linear-gradient(112deg, rgba(248,251,253,.93) 0%, rgba(242,247,251,.83) 44%, rgba(210,221,237,.25) 76%, rgba(184,200,216,.12) 100%);
    }
    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: -2%;
      right: -2%;
      bottom: -12px;
      height: 72px;
      background:
        radial-gradient(45px 24px at 5% 74%, rgba(255,255,255,.88) 98%, transparent 100%),
        radial-gradient(72px 32px at 15% 83%, rgba(255,255,255,.83) 98%, transparent 100%),
        radial-gradient(58px 29px at 28% 78%, rgba(255,255,255,.87) 98%, transparent 100%),
        radial-gradient(74px 36px at 43% 85%, rgba(255,255,255,.82) 98%, transparent 100%),
        radial-gradient(60px 30px at 57% 80%, rgba(255,255,255,.84) 98%, transparent 100%),
        radial-gradient(80px 37px at 73% 86%, rgba(255,255,255,.78) 98%, transparent 100%),
        radial-gradient(68px 32px at 88% 78%, rgba(255,255,255,.85) 98%, transparent 100%);
      opacity: .85;
      pointer-events: none;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
      width: 57%;
      max-width: 720px;
      padding-top: 0;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: flex-start;
      gap: 12px;
      margin: 0 0 27px -4px;
      color: var(--blue);
    }
    .brand-word {
      display: block;
      font-family: Caveat, cursive;
      font-size: clamp(5rem, 8.1vw, 7.2rem);
      line-height: .76;
      font-weight: 700;
      letter-spacing: -.045em;
      text-shadow: 0 3px 0 rgba(255,255,255,.76);
    }
    .brand-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding-top: 2px;
    }
    .brand-cat { width: 58px; height: 48px; color: var(--blue); }
    .brand-sub {
      margin-top: 0;
      font-family: Caveat, cursive;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--deep);
      transform: rotate(-4deg);
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 22px;
      margin: 8px 0 18px;
    }
    .avatar-frame {
      flex: 0 0 166px;
      width: 166px;
      height: 166px;
      padding: 6px;
      border: 3px solid var(--powder);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, var(--mist));
      box-shadow: 0 0 0 6px rgba(255,255,255,.72), 0 10px 27px rgba(23,49,80,.14);
      overflow: hidden;
    }
    .avatar-frame img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 28%;
    }
    .profile-info {
      min-width: 0;
      padding: 7px 0 7px 23px;
      border-left: 2px solid rgba(98,126,163,.35);
    }
    .profile-info h1 {
      margin: 0;
      color: var(--navy);
      font-family: "Mitr", "IBM Plex Sans Thai", sans-serif;
      font-size: clamp(2.6rem, 4.7vw, 4.1rem);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: 1.05;
    }
    .handle {
      margin: 5px 0 0;
      color: var(--slate);
      font-size: 1.12rem;
      letter-spacing: .005em;
    }
    .welcome {
      margin: 4px 0 14px 3px;
      color: var(--slate);
      font-size: 1.32rem;
      line-height: 1.5;
      font-weight: 600;
    }
    .bio-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin: 0 0 6px 2px;
    }
    .bio-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border: 1.5px solid rgba(132,170,207,.65);
      border-radius: 999px;
      background: rgba(250,252,255,.74);
      color: var(--deep);
      font-size: .91rem;
      font-weight: 600;
      box-shadow: 0 3px 9px rgba(23,49,80,.06);
    }
    .bio-item svg { width: 18px; height: 18px; fill: currentColor; }
.hero-visual {
      position: absolute;
      z-index: 2;
      top: -10px;
      right: -8px;
      bottom: -36px;
      width: 55%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }
    .hero-character {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 16px 22px rgba(23,49,80,.13));
    }
    .hero-spark {
      position: absolute;
      color: var(--sky);
      font-size: 2rem;
      text-shadow: 0 2px 0 white;
      opacity: .9;
    }
    .spark-one { top: 34%; left: 3%; }
    .spark-two { top: 17%; left: 20%; font-size: 1.35rem; }
    .spark-three { top: 52%; right: 3%; font-size: 1.55rem; }

    /* DASHBOARD / LINKS */
    .dashboard {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: minmax(0, 2.15fr) minmax(300px, .85fr);
      gap: 22px;
      align-items: stretch;
      margin-top: -4px;
    }
    .links-area { min-width: 0; }
    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
      padding-left: 5px;
      color: var(--deep);
      font-family: "Mitr", "IBM Plex Sans Thai", sans-serif;
      font-size: 1.38rem;
      font-weight: 600;
      letter-spacing: -.025em;
    }
    .heading-star {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 2px solid rgba(132,170,207,.7);
      border-radius: 16px;
      color: var(--blue);
      background: rgba(255,255,255,.82);
      box-shadow: 0 4px 0 rgba(171,186,209,.35);
      font-size: 1.25rem;
      transform: rotate(-7deg);
    }
    .section-heading::after {
      content: "";
      flex: 1;
      height: 2px;
      margin-left: 6px;
      background: linear-gradient(90deg, rgba(132,170,207,.6), transparent);
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .link-card {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 174px;
      gap: 15px;
      padding: 18px 20px 18px 16px;
      border: 2px solid rgba(171,186,209,.86);
      border-radius: 27px;
      overflow: hidden;
      color: var(--navy);
      text-decoration: none;
      background: linear-gradient(130deg, rgba(250,252,255,.98), rgba(229,236,246,.89));
      box-shadow: 0 5px 0 rgba(171,186,209,.32), 0 11px 25px rgba(23,49,80,.09);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .link-card::before {
      content: "✦";
      position: absolute;
      z-index: -1;
      top: 10px;
      right: 18px;
      color: rgba(132,170,207,.52);
      font-size: 1.1rem;
    }
    .link-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(250,252,255,0) 28%, rgba(250,252,255,.22) 58%, rgba(250,252,255,.68) 100%);
      pointer-events: none;
    }
    .link-card:hover {
      transform: translateY(-4px) rotate(-.25deg);
      border-color: var(--sky);
      box-shadow: 0 7px 0 rgba(171,186,209,.42), 0 17px 30px rgba(23,49,80,.14);
    }
    .link-card:active { transform: translateY(-1px); }
    .link-card:focus-visible { outline: 3px solid rgba(60,100,150,.58); outline-offset: 4px; }

    .icon-box {
      position: relative;
      z-index: 2;
      flex: 0 0 86px;
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px solid rgba(132,170,207,.56);
      border-radius: 23px;
      background: linear-gradient(145deg, #e5e9ea, #c8d5e6);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.58), 0 4px 10px rgba(23,49,80,.09);
    }
    .chibi-icon {
      width: 74px;
      height: 74px;
      object-fit: contain;
      display: block;
    }
    .link-content { position: relative; z-index: 3; flex: 1; min-width: 0; }
    .link-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .link-title {
      margin: 0;
      color: var(--navy);
      font-family: "Mitr", "IBM Plex Sans Thai", sans-serif;
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -.025em;
    }
    .link-desc {
      margin: 5px 0 0;
      max-width: 255px;
      color: var(--steel);
      font-family: "IBM Plex Sans Thai", sans-serif;
      font-size: .84rem;
      line-height: 1.48;
      font-weight: 500;
    }
    .pill {
      padding: 3px 10px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      color: var(--ice);
      background: linear-gradient(110deg, var(--blue), var(--slate));
      box-shadow: 0 3px 8px rgba(23,49,80,.12);
      font-family: Inter, sans-serif;
      font-size: .67rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .card-art {
      position: absolute;
      z-index: 1;
      top: 3%;
      right: 35px;
      width: 34%;
      height: 94%;
      object-fit: contain;
      object-position: center right;
      opacity: .39;
      mix-blend-mode: multiply;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 38%, #000 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 38%, #000 100%);
    }
    .arrow {
      position: relative;
      z-index: 4;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: white;
      background: linear-gradient(145deg, var(--sky), var(--blue));
      box-shadow: 0 4px 9px rgba(23,49,80,.17);
      transition: transform .2s ease;
    }
    .arrow svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .link-card:hover .arrow { transform: translateX(4px); }

    /* FOLLOW PANEL */
    .follow-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 18px;
      overflow: hidden;
      border: 2px solid rgba(171,186,209,.86);
      border-radius: 31px;
      background: linear-gradient(145deg, rgba(249,252,255,.96), rgba(222,232,245,.88));
      box-shadow: 0 5px 0 rgba(171,186,209,.30), 0 11px 25px rgba(23,49,80,.09);
    }
    .follow-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: -5px 0 16px;
      color: var(--blue);
      font-family: "Mitr", "IBM Plex Sans Thai", sans-serif;
      font-size: 1.38rem;
      font-weight: 600;
      letter-spacing: -.025em;
    }
    .follow-heading .heading-star {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      background: #f6f9fd;
    }
    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      position: relative;
      z-index: 3;
    }
    .social-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      min-height: 104px;
      padding: 10px 8px;
      border: 1.5px solid rgba(132,170,207,.63);
      border-radius: 19px;
      background: rgba(255,255,255,.64);
      color: var(--deep);
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(23,49,80,.06);
      transition: transform .2s ease, background .2s ease;
    }
    .social-tile:hover { transform: translateY(-3px); background: white; }
    .social-tile img { width: 58px; height: 58px; object-fit: contain; }
    .social-tile span {
      font-family: "Mitr", sans-serif;
      font-size: .83rem;
      font-weight: 500;
    }
/* TABLET */
    @media (max-width: 1050px) and (min-width: 761px) {
      .site-shell { width: min(100% - 36px, 980px); }
      .hero { min-height: 570px; padding-left: 2.5%; }
      .hero-copy { width: 60%; }
      .avatar-frame { width: 136px; height: 136px; flex-basis: 136px; }
      .hero-visual { width: 52%; right: -12px; }
      .dashboard { grid-template-columns: minmax(0, 1.7fr) minmax(260px, .8fr); gap: 15px; }
      .link-grid { gap: 12px; }
      .link-card { padding: 14px 13px; gap: 10px; min-height: 160px; }
      .icon-box { width: 70px; height: 70px; flex-basis: 70px; border-radius: 20px; }
      .chibi-icon { width: 60px; height: 60px; }
      .link-title { font-size: 1.02rem; }
      .link-desc { font-size: .78rem; }
      .card-art { right: 23px; opacity: .30; }
      .follow-panel { padding: 16px 13px; }
      .social-grid { gap: 8px; }
      .social-tile img { width: 49px; height: 49px; }
    }

    /* MOBILE */
    @media (max-width: 760px) {
      .site-shell { width: min(calc(100% - 22px), 620px); padding-top: 10px; }
      .hero {
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 24px 17px 10px;
        border-radius: 29px;
      }
      .hero::before { border-radius: 29px; background: linear-gradient(160deg, rgba(250,252,255,.96), rgba(229,236,246,.90)); }
      .hero::after { bottom: 0; height: 35px; }
      .hero-copy { width: 100%; max-width: none; }
      .brand-lockup { margin-bottom: 21px; gap: 9px; }
      .brand-word { font-size: 4.9rem; }
      .brand-cat { width: 47px; height: 40px; }
      .brand-sub { font-size: 1.55rem; }
      .profile-row { gap: 13px; margin: 8px 0 13px; }
      .avatar-frame { width: 112px; height: 112px; flex-basis: 112px; }
      .profile-info { padding-left: 13px; }
      .profile-info h1 { font-size: 2.4rem; }
      .handle { font-size: .91rem; }
      .welcome { margin-top: 8px; font-size: 1.08rem; line-height: 1.5; }
      .bio-line { gap: 7px; margin-bottom: 6px; }
      .bio-item { padding: 5px 10px; font-size: .78rem; }
      .hero-visual {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        width: 100%;
        height: clamp(270px, 72vw, 400px);
        margin: -1px auto -12px;
        order: 2;
      }
      .hero-character { width: 100%; height: 100%; object-position: center bottom; }
      .hero-spark { display: none; }

      .dashboard {
        grid-template-columns: 1fr;
        gap: 18px;
        margin-top: 0;
      }
      .section-heading { font-size: 1.2rem; margin-bottom: 12px; }
      .heading-star { width: 36px; height: 36px; border-radius: 13px; }
      .link-grid { grid-template-columns: 1fr; gap: 12px; }
      .link-card { min-height: 128px; padding: 12px; gap: 11px; border-radius: 23px; }
      .icon-box { flex-basis: 72px; width: 72px; height: 72px; border-radius: 18px; }
      .chibi-icon { width: 62px; height: 62px; }
      .link-title { font-size: 1.04rem; }
      .link-desc { font-size: .78rem; max-width: 210px; }
      .card-art { right: 24px; width: 34%; opacity: .28; }
      .arrow { width: 29px; height: 29px; }
      .follow-panel { min-height: 0; padding: 15px 16px; border-radius: 27px; }
      .follow-heading { font-size: 1.2rem; margin-bottom: 12px; }
      .social-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 300px; }
      .social-tile { min-height: 86px; border-radius: 16px; }
      .social-tile img { width: 48px; height: 48px; }
      .social-tile span { font-size: .78rem; }
      .panel-paws { right: 12px; bottom: 76px; font-size: 1rem; }
    }

    @media (max-width: 440px) {
      .site-shell { width: calc(100% - 16px); }
      .hero { padding: 21px 12px 8px; border-radius: 24px; }
      .brand-lockup { margin-left: 0; }
      .brand-word { font-size: 4.35rem; }
      .brand-cat { width: 41px; height: 36px; }
      .brand-sub { font-size: 1.38rem; }
      .avatar-frame { width: 94px; height: 94px; flex-basis: 94px; }
      .profile-row { gap: 10px; }
      .profile-info { padding: 7px 0 7px 10px; }
      .profile-info h1 { font-size: 2.05rem; }
      .handle { font-size: .80rem; }
      .welcome { font-size: 1rem; }
      .bio-item { padding: 4px 8px; font-size: .72rem; gap: 5px; }
      .bio-item svg { width: 15px; height: 15px; }
      .hero-visual { height: clamp(245px, 70vw, 315px); }
      .link-card { min-height: 116px; padding: 10px; gap: 8px; }
      .icon-box { width: 62px; height: 62px; flex-basis: 62px; border-radius: 16px; }
      .chibi-icon { width: 54px; height: 54px; }
      .link-title { font-size: .96rem; }
      .link-desc { font-size: .72rem; max-width: 170px; }
      .pill { font-size: .61rem; padding: 3px 8px; }
      .card-art { width: 30%; right: 19px; opacity: .20; }
      .arrow { width: 25px; height: 25px; }
      .follow-panel { padding: 13px 12px; }
    }

    @media (max-width: 360px) {
      .brand-word { font-size: 3.95rem; }
      .profile-info h1 { font-size: 1.85rem; }
      .avatar-frame { width: 84px; height: 84px; flex-basis: 84px; }
      .bio-line { gap: 5px; }
      .bio-item { font-size: .68rem; }
      .link-card { gap: 7px; }
      .icon-box { width: 56px; height: 56px; flex-basis: 56px; }
      .chibi-icon { width: 48px; height: 48px; }
      .link-title { font-size: .90rem; }
      .link-desc { font-size: .67rem; max-width: 150px; }
    }

    @media (max-width: 760px) {
      body::before, body::after { width: 9vw; opacity: .09; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    @media (hover: none) {
      .link-card:hover, .social-tile:hover { transform: none; }
    }

    .hero-character { display: none !important; }
    .hero-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(229,233,234,.02) 70%, rgba(229,233,234,.18));
    }
    .hero-spark { z-index: 1; }

    /* With no cat illustration, keep Follow Me panel compact. */
    .follow-panel { min-height: 0; padding-bottom: 18px; }

    @media (max-width: 1050px) and (min-width: 761px) {
      .hero-visual { background-position: 62% top; }
    }
    @media (max-width: 760px) {
      .hero-visual {
        background-size: contain;
        background-position: center bottom;
        -webkit-mask-image: none;
        mask-image: none;
        border-radius: 22px;
      }
      .hero-visual::before {
        background: linear-gradient(to bottom, transparent 70%, rgba(229,233,234,.16));
      }
      .follow-panel { min-height: 0; padding-bottom: 15px; }
    }
    @media (max-width: 440px) {
      .follow-panel { padding-bottom: 13px; }
    }


    /* HEADER ALIGNMENT UPDATE: centered brand, avatar, and interests */
    .brand-lockup {
      display: flex;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      justify-content: center;
      align-items: flex-start;
    }

    .profile-row {
      justify-content: center;
    }

    .welcome {
      margin-left: 0;
      margin-right: 0;
      text-align: center;
    }

    .bio-line {
      justify-content: center;
      margin-left: 0;
      margin-right: 0;
    }

    @media (max-width: 760px) {
      .brand-lockup {
        margin-left: auto;
        margin-right: auto;
      }
      .profile-row {
        justify-content: center;
      }
      .welcome {
        text-align: center;
      }
      .bio-line {
        justify-content: center;
      }
    }

  

    /* DESKTOP BALANCE — reduce unused space under the centered profile.
       Mobile rules are intentionally untouched. */
    @media (min-width: 1051px) {
      .hero {
        min-height: 520px;
        padding-top: 26px;
        padding-bottom: 26px;
      }
      .hero-visual {
        top: -8px;
        bottom: -28px;
      }
      .brand-lockup {
        margin-bottom: 23px;
      }
      .profile-row {
        margin-top: 7px;
        margin-bottom: 14px;
      }
      .welcome {
        margin-bottom: 12px;
      }
    }

    /* Keep tablet proportions balanced without changing the phone layout. */
    @media (min-width: 761px) and (max-width: 1050px) {
      .hero {
        min-height: 540px;
        padding-top: 27px;
        padding-bottom: 30px;
      }
      .hero-visual {
        top: -8px;
        bottom: -28px;
      }
    }
